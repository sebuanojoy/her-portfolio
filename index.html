<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" href="favicon.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>HER Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Pinyon+Script&amp;family=Quicksand:wght@400;500;600;700&amp;display=swap">
<style id="page-css">
/* Layout: sticky ribbon nav, one "page" visible at a time (hash routed), coquette ornaments on blush stripes. Content lives in a <template> and a JSON state so edit mode can save it. */
:root{
  --bg:#fbf1e8; --bg2:#f6e4d8; --card:#fffaf6; --ink:#3a1a20; --muted:#765659;
  --pink:#e9a6a0; --pink-deep:#9c2a3f; --blush:#f7dcd3; --line:#ecd3c8; --lilac:#f1d9d2;
  --btn-bg:#9c2a3f; --btn-ink:#fff7f3; --btn-edge:#9c2a3f; --stripe:transparent;
  --display:"Instrument Serif",Georgia,serif; --script:"Pinyon Script","Snell Roundhand",cursive; --body:"Quicksand",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1214; --bg2:#271a1d; --card:#2a1c20; --ink:#f8e9e3; --muted:#d3adaa;
  --pink:#e58d9a; --pink-deep:#f08c9d; --blush:#3a2428; --line:#4d3238; --lilac:#3a2a30;
  --stripe:transparent; --btn-bg:#e98597; --btn-ink:#2a0f15; --btn-edge:#e98597; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1b1214; --bg2:#271a1d; --card:#2a1c20; --ink:#f8e9e3; --muted:#d3adaa;
  --pink:#e58d9a; --pink-deep:#f08c9d; --blush:#3a2428; --line:#4d3238; --lilac:#3a2a30;
  --stripe:transparent; --btn-bg:#e98597; --btn-ink:#2a0f15; --btn-edge:#e98597; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:repeating-linear-gradient(90deg,var(--stripe) 0 28px,transparent 28px 56px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance}
.script{font-family:var(--script);color:var(--pink-deep);font-weight:400}
.eyebrow{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--pink-deep);font-weight:700}
p{margin:0}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:12px}
nav{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 6px 0 var(--blush)}
.logo{display:flex;align-items:center;gap:6px;font-family:var(--script);font-size:1.7rem;color:var(--pink-deep);text-decoration:none;line-height:1;margin-right:auto}
.logo svg{width:1.5em;height:1em}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{white-space:nowrap;text-decoration:none;color:var(--ink);font-weight:600;font-size:.82rem;letter-spacing:.06em;padding:8px 14px;border-radius:999px;transition:background .2s,transform .2s}
.links a:hover{background:var(--blush);transform:translateY(-2px) rotate(-2deg)}
.links a[aria-current="page"]{background:var(--btn-bg);color:var(--btn-ink)}
.theme{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--blush);color:var(--pink-deep);display:grid;place-items:center;cursor:pointer;flex:none;font-size:1.1rem;padding:0}
.theme:hover{transform:rotate(20deg) scale(1.08)}
@media(max-width:620px){nav{flex-wrap:wrap;border-radius:26px;padding:10px 12px}.links{order:3;width:100%}.logo{font-size:1.5rem}}

.btn{display:inline-flex;align-items:center;gap:10px;font:700 .95rem/1 var(--body);letter-spacing:.06em;text-decoration:none;cursor:pointer;
  color:var(--btn-ink);background:var(--btn-bg);border:2px solid var(--btn-edge);border-radius:999px;padding:14px 24px;
  box-shadow:0 5px 0 var(--btn-edge);transition:transform .15s,box-shadow .15s;position:relative}
.btn svg{font-size:1.15em}
.btn:hover{transform:translateY(-3px) rotate(-1.5deg);box-shadow:0 8px 0 var(--btn-edge)}
.btn:hover .wig{animation:wig .5s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--btn-edge)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.sm{padding:10px 16px;font-size:.8rem}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:3px}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

.page{display:none;padding-block:24px 48px}
.page.on{display:block;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 7px 0 var(--blush);min-width:0}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:36px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.6rem,7vw,4.6rem);margin-block:10px 14px}
.hero .script{font-size:clamp(2rem,5vw,3rem);display:block;line-height:1}
.hero p.lead{color:var(--muted);max-width:44ch;margin-bottom:24px}
.badge{display:inline-flex;gap:8px;align-items:center;background:var(--blush);border:2px dashed var(--line);border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:600}
.badge svg{color:var(--pink-deep)}
.art{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center}
.art .blob{position:absolute;inset:6%;background:radial-gradient(circle at 35% 30%,var(--card),var(--blush) 60%,var(--pink));border-radius:48% 52% 55% 45%/50% 45% 55% 50%;border:2px solid var(--line)}
.art .bf{position:absolute;color:var(--pink-deep);width:26%;height:26%;right:-2%;bottom:6%;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 6px 0 var(--blush));z-index:3}
.art .arch{position:relative;z-index:2;width:72%;aspect-ratio:3/4;border-radius:999px 999px 28px 28px;overflow:hidden;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line),0 10px 0 var(--blush)}
.art .arch img{width:100%;height:100%;object-fit:cover;object-position:50% 15%;display:block}
.art .bow{position:absolute;width:34%;height:22%;top:2%;left:8%;color:var(--pink-deep);transform:rotate(-14deg);z-index:3}
.art .sp{position:absolute;color:var(--pink-deep)}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(5deg)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:24px}.art{max-width:280px;margin:0 auto}}

.sec-title{text-align:center;margin:44px 0 22px}
.sec-title h2{font-size:clamp(1.8rem,4vw,2.5rem)}
.sec-title .script{font-size:1.9rem;display:block}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}.tile:last-child:nth-child(odd){grid-column:1/-1;width:50%;justify-self:center}}
.tile{position:relative;aspect-ratio:1;border:0;background:none;cursor:pointer;color:var(--pink);display:grid;place-items:center;padding:0;font:inherit;transition:transform .25s}
.tile:nth-child(2){color:#f6c9a8}.tile:nth-child(3){color:#f48fb1}.tile:nth-child(4){color:#c7b8f5}.tile:nth-child(5){color:#ffc9d6}.tile:nth-child(6){color:#f9a8bd}.tile:nth-child(7){color:#f6c9a8}
.tile svg.fl{position:absolute;inset:0;width:100%;height:100%;fill:currentColor;transition:transform .6s}
.tile:hover{transform:translateY(-6px) scale(1.04)}
.tile:hover svg.fl{transform:rotate(30deg)}
.tile span{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#4a1730;text-align:center;font-family:var(--display);font-weight:600;font-size:1.15rem;line-height:1.1}
.tile span svg{font-size:1.5rem}
.tile small{font:600 .68rem var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.8}

.band{margin-top:44px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--btn-bg);border:2px solid var(--btn-edge);border-radius:26px;padding:22px 26px;box-shadow:0 6px 0 var(--btn-edge);color:var(--btn-ink)}
.band h3{font-size:1.5rem}
.band .btn{background:#fffafb;color:#4a1730}

.about{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
@media(max-width:760px){.about{grid-template-columns:1fr}}
.polaroid{background:#fffafb;padding:14px 14px 18px;border-radius:6px;box-shadow:0 10px 0 var(--blush),0 0 0 2px var(--line);transform:rotate(-3deg);transition:transform .3s;max-width:300px;margin-inline:auto;text-align:center;color:#4a2433;width:100%}
.polaroid:hover{transform:rotate(1deg) scale(1.03)}
.polaroid .ph{aspect-ratio:1;background:linear-gradient(160deg,#ffd9e3,#f9a8bd);display:grid;place-items:center;color:#fff;overflow:hidden;position:relative}
.polaroid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.polaroid p{font-family:var(--script);font-size:1.6rem;color:#d9577f;line-height:1.3;margin-top:8px}
.polaroid small{display:block;font-size:.7rem;color:#8a5d6e;letter-spacing:.08em}
.about h2{font-size:clamp(2rem,4.5vw,3rem);margin-block:8px 14px}
.about p+p{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.chip{font:600 .85rem var(--body);color:var(--ink);background:var(--blush);border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .2s}
.chip:hover{transform:translateY(-2px) rotate(-2deg)}
.chip[aria-pressed="true"],.chip.on{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-edge)}
.fact{margin-top:16px;min-height:3.2em;background:var(--bg2);border-radius:16px;padding:14px 18px;color:var(--muted);font-style:italic;display:flex;gap:10px;align-items:flex-start}
.fact svg{color:var(--pink-deep);margin-top:5px}
.tl{margin-top:26px;display:grid;gap:14px;padding-left:22px;border-left:3px dotted var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-31px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:3px solid var(--card);box-shadow:0 0 0 2px var(--pink-deep)}
.tl b{font-family:var(--display);font-size:1.2rem}
.tl span{display:block;color:var(--muted);font-size:.9rem}

.filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.work{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 6px 0 var(--blush);transition:transform .25s,box-shadow .25s}
.work:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 12px 0 var(--blush)}
.work:focus-visible{outline:3px solid var(--pink-deep);outline-offset:3px}
.work .thumb{aspect-ratio:4/3;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.work .thumb>svg{width:34%;height:34%;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.work .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.work .thumb .heart{position:absolute;top:12px;right:12px;width:22px;height:22px;opacity:.9}
.work .meta{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px}
.work h3{font-size:1.4rem}
.work p{color:var(--muted);font-size:.9rem}
.work.add{align-items:center;justify-content:center;min-height:200px;border-style:dashed;color:var(--pink-deep);font-weight:700;gap:8px;text-align:center}
.tag{align-self:flex-start;font:700 .68rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--pink-deep);background:var(--blush);padding:4px 10px;border-radius:999px}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(74,36,51,.45);backdrop-filter:blur(4px)}
.modal .card{max-width:520px;width:100%;max-height:86vh;overflow:auto;position:relative;animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.modal .x{position:absolute;top:14px;right:14px}
.modal h3{font-size:2rem;margin-block:10px}
.modal .thumb{border-radius:18px;aspect-ratio:16/8;display:grid;place-items:center;color:#fff;overflow:hidden;position:relative}
.modal .thumb svg{width:20%;height:50%}
.modal .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.modal ul{padding-left:20px;color:var(--muted);margin:12px 0 22px}

.acc{display:grid;gap:16px;max-width:760px;margin:0 auto}
.acc details{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:0 6px 0 var(--blush);overflow:hidden}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 22px;font-family:var(--display);font-weight:600;font-size:1.4rem}
.acc summary::-webkit-details-marker{display:none}
.acc summary .ic{width:44px;height:44px;border-radius:50%;background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;font-size:1.3rem;flex:none}
.acc summary .car{margin-left:auto;color:var(--pink-deep);transition:transform .3s}
.acc details[open] summary .car{transform:rotate(45deg) scale(1.2)}
.acc details>div{padding:0 22px 22px 80px;color:var(--muted)}
.acc details>div .row{margin-top:14px}
@media(max-width:560px){.acc details>div{padding-left:22px}}
.acc .erow{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px}

.contact{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:760px){.contact{grid-template-columns:1fr}}
.contact h2{font-size:2.2rem;margin-block:8px 12px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pink-deep)}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:10px 14px;width:100%}
textarea{min-height:90px;resize:vertical}
.field textarea{min-height:120px}
.copyline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);border-radius:16px;padding:10px 12px 10px 16px;margin:12px 0}
.copyline code{font:600 .95rem var(--body);user-select:all;overflow-wrap:anywhere;min-width:0;flex:1}
.socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.hint{font-size:.82rem;color:var(--muted);margin-top:10px}

footer{text-align:center;padding:10px 0 40px;color:var(--muted);font-size:.9rem}
footer .script{font-size:1.6rem}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:90;background:var(--btn-bg);color:var(--btn-ink);border:2px solid var(--btn-edge);box-shadow:0 5px 0 var(--btn-edge);border-radius:999px;padding:12px 22px;font-weight:700;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.burst{position:fixed;pointer-events:none;z-index:70;color:var(--pink-deep);animation:burst .9s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3);opacity:0}}
.fb{position:fixed;pointer-events:none;z-index:1;color:var(--pink);opacity:.55;animation:drift linear infinite}
@keyframes drift{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-12vh) rotate(360deg)}}
.page,header,footer{position:relative;z-index:2}

.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tools .erow,.tools>.btn{grid-column:1/-1}
.tool{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--blush);transition:transform .25s}
.tool:hover{transform:translateY(-5px) rotate(-1deg)}
.tool:hover .tb{animation:wig .5s}
.tb{width:54px;height:54px;border-radius:50%;background:var(--c);color:#4a1730;display:grid;place-items:center;font-size:1.6rem;flex:none}
.tool h3{font-size:1.3rem}
.tool p{color:var(--muted);font-size:.85rem;line-height:1.4}
.media{display:grid;gap:12px;justify-items:start;margin-top:14px}
.media:empty{display:none}
.media video,.media audio{width:100%;border-radius:16px}
.pdf{width:100%;display:grid;gap:10px;background:var(--bg2);border-radius:16px;padding:10px;max-height:60vh;overflow:auto}
.pdf canvas{width:100%;height:auto;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.modal.wide .card{max-width:780px}
.roles-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media(max-width:760px){.roles-grid{grid-template-columns:1fr}}
.col-h{display:flex;gap:10px;align-items:center;font-size:1.7rem;margin-bottom:16px}
.col-h svg{color:var(--pink-deep)}
.stack{display:grid;gap:16px}
.rcard{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 6px 0 var(--blush);transition:transform .25s}
.rcard:hover{transform:translateY(-4px) rotate(-.8deg)}
.rb{width:48px;height:48px;border-radius:50%;background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;font-size:1.4rem;flex:none}
.rcard.award .rb{background:var(--lilac);color:var(--pink-deep)}
.rcard h3{font-size:1.35rem}
.org{color:var(--pink-deep);font-weight:700;font-size:.85rem;letter-spacing:.04em;margin:2px 0 6px}
.rtext{color:var(--muted);font-size:.92rem;margin-top:8px}
.feat{margin-bottom:28px}
.feat h3{font-size:1.8rem;margin:6px 0 4px}
.feat p{color:var(--muted)}
.stack.two{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.quote{margin:0;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 6px 0 var(--blush)}
.quote blockquote{margin:0 0 12px;font-family:var(--display);font-size:1.25rem;font-style:italic;line-height:1.35}
.quote figcaption{display:grid;font-size:.85rem;color:var(--muted)}
.quote figcaption b{color:var(--pink-deep);font-size:.95rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px;padding:6px}
.gal figure{margin:0;background:#fffafb;padding:10px 10px 12px;border-radius:6px;box-shadow:0 8px 0 var(--blush),0 0 0 2px var(--line);transform:rotate(var(--r,0deg));cursor:pointer;transition:transform .25s;color:#4a2433}
.gal figure:hover,.gal figure:focus-visible{transform:rotate(0) scale(1.04)}
.gal figure img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gal figcaption{font-family:var(--script);font-size:1.25rem;color:#d9577f;text-align:center;margin-top:6px;line-height:1.2}
.collage{columns:3 230px;column-gap:18px;padding:4px}
.collage figure{margin:0 0 18px;break-inside:avoid;position:relative;border-radius:22px;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line),0 7px 0 var(--blush);cursor:pointer;background:var(--card);transition:transform .25s}
.collage figure:hover,.collage figure:focus-visible{transform:translateY(-5px) rotate(-.6deg)}
.collage figure img{display:block;width:100%;height:auto}
.collage figcaption{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;text-align:center;font-family:var(--script);font-size:1.45rem;line-height:1.15;color:#fff;background:linear-gradient(transparent,rgba(74,36,51,.72));opacity:0;transition:opacity .25s}
.collage figure:hover figcaption,.collage figure:focus-visible figcaption{opacity:1}
@media(hover:none){.collage figcaption{opacity:1}}
.rm[disabled]{opacity:.35;cursor:default;text-decoration:none}
.cpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.cpcard{background:var(--card);border:2px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 7px 0 var(--blush);transition:transform .25s,box-shadow .25s;min-width:0}

.cpimg{aspect-ratio:16/9;overflow:hidden;background:linear-gradient(150deg,var(--blush),var(--pink))}
.cpimg img{width:100%;height:100%;object-fit:cover;display:block}
.cpbody{padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px}
.cpbody h3{font-size:1.7rem}
.cpbody p{color:var(--muted)}
.xl{position:relative;display:grid;gap:22px;padding-left:34px}
.xl::before{content:"";position:absolute;left:10px;top:12px;bottom:12px;border-left:3px dotted var(--line)}
.xi{position:relative;display:flex;flex-direction:column;gap:6px;transition:transform .25s}

.xi:hover{transform:translateX(4px)}
.xi h3{font-size:1.8rem}
.xorg{font-weight:700;color:var(--pink-deep)}
.xaddr{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
.xi ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.xi li+li{margin-top:4px}
/* edit mode */
.pencil{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ebar{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;background:var(--card);border:2px solid var(--pink-deep);border-radius:26px;padding:10px 14px;box-shadow:0 6px 0 var(--blush);width:max-content;max-width:calc(100vw - 24px)}
.ebar span{font-size:.8rem;color:var(--muted);font-weight:600}
body.editing [data-e]{outline:2px dashed var(--pink-deep);outline-offset:4px;border-radius:6px;cursor:text;min-width:2ch}
body.editing .arch,body.editing .polaroid{cursor:pointer;outline:3px dashed var(--pink-deep);outline-offset:4px}
body.editing{padding-bottom:110px}
.erow{flex:1 1 100%;display:grid;gap:8px;background:var(--bg2);border:2px dashed var(--line);border-radius:18px;padding:12px;width:100%}
.erow .row{gap:8px}
.rm{font:700 .75rem var(--body);color:var(--pink-deep);background:none;border:0;cursor:pointer;justify-self:start;text-decoration:underline;padding:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.fb{display:none}}

ve and technical operations."},{"when":"June 2025 - August 2025","role":"Intern","org":"Philippine Information Agency - Bulacan","addr":"City of  Malolos, Bulacan, Philippines","text":"Public Communication & Content Creation: Assisted in drafting press releases, news articles, and social media captions to disseminate government programs and local updates across Bulacan.\nMultimedia & Event Coverage: Supported field coverages, documented official events, and designed publication materials to boost public engagement and information reach.\nCommunity & Youth Engagement: Collaborated with fellow interns to organize an online youth forum highlighting the digital transition of public sector transactions and payments in Bulacan.\nAdministrative & Editorial Support: Monitored local news, compiled media reports, and assisted agency staff with daily administrative and communication tasks."}],"roles":[{"title":"Writing Division Supervisor (2026)","org":"CAL Media Hub","when":"2026","text":""},{"title":"Creative Writer (2025)","org":"CAL Media Hub","when":"2025","text":""},{"title":"Research Team Coordinator and Researcher (2025-2026)","org":"Bulacan State University","when":"2025-2026","text":"Thesis Writing 2: Ang Tanging Ina"},{"title":"Head Writer (2024)","org":"Bulacan State University","when":"2024","text":"Baburugingling Awards 2024"},{"title":"Associate Producer (2024)","org":"Bulacan State University","when":"2024","text":"Fifi’s Drag Race Season 3, Episode 2"},{"title":"Production Manager (2024)","org":"Bulacan State University","when":"2024","text":"“Deja Vu” Short Film Production"},{"title":"Researcher and Writer (2023)","org":"Bulacan State University","when":"2023","text":"Research-Documentary Production “Padaluyin”"},{"title":"Headwriter, Writer, Showbiz News Anchor, and Camera Operator (2023)","org":"Bulacan State University","when":"2023","text":"Haraya TV News Production (English)"},{"title":"VMIX Operator (2023)","org":"Bulacan State University","when":"2023"  office support roles, virtual assistant work, and positions in government offices and public service. I can also take on communications, content and social media work, since that's what I studied."},{"q":"Do you have experience working in a government office?","a":"Yes. In July to August 2026 I worked as an Administrative Assistant III at the Department of Information and Communications Technology (DICT), handling emails, schedules and appointments, and communicating with officials. Before that, I interned at the Philippine Information Agency - Bulacan (June to August 2025), writing news articles on provincial events and government programs."},{"q":"What administrative tasks can you take on?","a":"Email and inbox management, calendar and appointment scheduling, correspondence, report writing and documentation, keeping records organized, and research. I can also help with presentations, graphics and social media posts when needed."},{"q":"How do you handle deadlines and many tasks at once?","a":"I plan first, then work through the list by priority. As Writing Division Supervisor at CAL Media Hub, I kept a whole creative team on schedule, and as Research Team Coordinator for our thesis, I set deadlines and divided tasks so every chapter was submitted on time. I like building simple systems, like checklists and calendars, so nothing slips."},{"q":"Which tools and software are you comfortable with?","a":"Microsoft Office 365 (Word, Excel, PowerPoint), Google Workspace (Docs, Sheets, Calendar), Zoom, Canva and CapCut, and AI tools like Gemini, Claude and ChatGPT. I also handle social media content on Facebook, Instagram and TikTok."},{"q":"How do you communicate with clients, officials and teammates?","a":"Clearly and respectfully, in English and Filipino. I write professional emails, give updates before they are asked for, and ask early when instructions aren't clear. I'm used to dealing courteously with officials, residents and the public."},{"q":"Can you work independently and handle confidential information?","a":"Yes. I follow instructions carefully, take ownership of my tasks, and check in when something needs a decision. I treat office records and correspondence with care and share information only with the people who need it."},{"q":"How do you take feedback?","a":"Gladly. I treat feedback as a way to get better and apply it right away. A clear, specific note helps me most."},{"q":"Do you have experience supervising or leading a team?","a":"Yes. I was promoted from Creative Writer to Writing Division Supervisor at CAL Media Hub, where I supervised the creative writing team and its workflow so everyone met their deadlines. I also served as Research Team Coordinator for our thesis, setting deadlines and distributing tasks among the team."},{"q":"Can you also help with content creation and social media?","a":"Yes. I create graphics in Canva, edit videos and reels in CapCut, and have produced podcasts, scripts and news articles. I've handled content for Facebook, Instagram and TikTok, so I can support a team's online presence alongside admin work."},{"q":"Are you comfortable talking with officials, clients and the public?","a":"Yes. I've interviewed local residents and government officials, hosted a virtual youth forum on the DTI's modernization and digital payments, and communicated with officials on behalf of the DICT office. I stay respectful, prepared and clear in every conversation."},{"q":"How quickly can you learn new systems or software?","a":"Quickly. I adapt to new work environments fast, and I keep learning. In November 2026 I completed several Canva trainings, including Graphic Design Essentials and AI Essentials. I'm also comfortable using AI tools to research and draft, then checking the work myself."},{"q":"What was your thesis about, and what did you learn from it?","a":"Our thesis, Ang Tanging Ina, was an awareness campaign on Republic Act No. 11861 (the Expanded Solo Parents Welfare Act) for solo mothers in Malolos, Bulacan. I led the research team, interviewed solo mothers with empathy and ethical standards, and helped develop flyers, tarpaulins, video reels and a documentary. It taught me how to turn public policy into something people can easily understand."},{"q":"When are you available, and how can we get in touch?","a":"I'm open to work now. Send me a message on the Connect page or email me, and we can talk about schedule and start date."}],"ready":{"avail":"Mon-Fri, 8:00AM - 12:00 Midnight (Remote, Hybrid, On-site)","speed":"102.11Mbps for download / 82.02Mbps for upload and a backup mobile data","device":"64-bit Windows laptop (x64-based processor), AMD Ryzen 5 4500U, 8.00 GB of installed RAM (7.37 GB usable)","typing":"80WPM with 96% Accuracy","langs":"English (Fluent - C2), Filipino (Native)","shots":[]},"calendly":"https://calendly.com/sebuanojoy/30min"}</script>

/* ---- clipboard ---- */
function copy(text, ok){
  const done = () => toast(ok);
  const fallback = () => { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); try{ document.execCommand("copy"); done(); }catch(_){ toast("Select the text and copy it"); } t.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ---- image helper ---- */
function toDataUrl(file, max, q){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image();
      im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", q)); };
      im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

function thumbHtml(w, big){ const k = kd(w.kind); return `<div class="thumb" style="background:linear-gradient(150deg,${k.c[0]},${k.c[1]})">${(w.img || w.thumb) ? `<img src="${esc(w.img || w.thumb)}" alt="">` : ic(k.icon)}${big ? "" : ic("heart","heart")}</div>`; }

async function renderPdf(box, url){
  box.innerHTML = '<p class="hint">Loading the PDF…</p>';
  try{
    if(!window.pdfjsLib) throw new Error("pdf.js missing");
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const buf = await (await fetch(url)).arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    box.innerHTML = "";
    const n = Math.min(pdf.numPages, 40);
    for(let p = 1; p <= n; p++){
      const page = await pdf.getPage(p);
      const w = (box.clientWidth - 20) || 600;
      const base = page.getViewport({scale: 1});
      const vp = page.getViewport({scale: (w / base.width) * Math.min(window.devicePixelRatio || 1, 2)});
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      box.appendChild(c);
    }
    if(pdf.numPages > n){ const h = document.createElement("p"); h.className = "hint"; h.textContent = "Showing the first " + n + " pages. Open the PDF to read the rest."; box.appendChild(h); }
  }catch(_){
    box.innerHTML = '<p class="hint">The preview could not load here. Use the button below to open the PDF.</p>';
  }
}

function fillMedia(box, w){
  box.innerHTML = "";
  const m = w.media;
  if(m && m.url){
    if(m.type === "video"){ const v = document.createElement("video"); v.controls = true; v.playsInline = true; v.preload = "metadata"; v.src = m.url; box.appendChild(v); }
    else if(m.type === "audio"){ const a = document.createElement("audio"); a.controls = true; a.preload = "metadata"; a.src = m.url; box.appendChild(a); }
    else if(m.type === "image"){ const im = document.createElement("img"); im.src = m.url; im.alt = w.title || ""; im.loading = "lazy"; box.appendChild(im); }
    else if(m.type === "pdf"){
      const pg = document.createElement("div"); pg.className = "pdf"; box.appendChild(pg);
      renderPdf(pg, m.url);
      const l = document.createElement("a"); l.className = "btn sm alt"; l.href = m.url; l.target = "_blank"; l.rel = "noopener"; l.innerHTML = ic("doc") + " Open PDF in a new tab"; box.appendChild(l);
    }
  }
  const link = safeUrl(w.link);
  if(link){ const a = document.createElement("a"); a.className = "btn sm"; a.href = link; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = ic("play") + " See it online"; box.appendChild(a); }
}

function mediaTypeOf(f){ const t = f.type || ""; return t.startsWith("video/") ? "video" : t.startsWith("audio/") ? "audio" : t === "application/pdf" ? "pdf" : t.startsWith("image/") ? "image" : ""; }

/* makes a cover image from the first frame of a video, the first page of a PDF, or a photo */
async function makeThumb(f, type){
  try{
    if(type === "image") return await toBlob(f, 900, .8);
    if(type === "video"){
      return await new Promise(res => {
        const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto";
        const url = URL.createObjectURL(f); let done = false;
        const fin = b => { if(done) return; done = true; clearTimeout(timer); URL.revokeObjectURL(url); res(b); };
        const timer = setTimeout(() => fin(null), 8000);
        v.onloadeddata = () => { try{ v.currentTime = Math.min(1, (v.duration || 2) * .1); }catch(_){ fin(null); } };
        v.onseeked = () => { try{
          const k = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight)); const c = document.createElement("canvas");
          c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
          c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
          c.toBlob(b => fin(b), "image/jpeg", .8);
        }catch(_){ fin(null); } };
        v.onerror = () => fin(null);
        v.src = url;
      });
    }
    if(type === "pdf"){
      if(!window.pdfjsLib) return null;
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      const pdf = await pdfjsLib.getDocument({data: await f.arrayBuffer()}).promise;
      const page = await pdf.getPage(1); const base = page.getViewport({scale: 1}); const vp = page.getViewport({scale: 900 / base.width});
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await page.render({canvasContext: c.getContext("2d"), viewport: vp}).promise;
      return await new Promise(res => c.toBlob(b => res(b), "image/jpeg", .82));
    }
  }catch(_){ /* no cover made; the icon shows instead */ }
  return null;
}
async function attachMedia(obj, f, after){
  const t = mediaTypeOf(f);
  if(!t){ toast("Please choose a video, audio, PDF or image file"); return; }
  if(f.size > 20 * 1024 * 1024){ toast("That file is over 20 MB. Paste a link instead."); return; }
  const assets = await claude.use("assets");
  if(!assets){ toast("Uploads aren't available for your account here"); return; }
  toast("Uploading… this can take a moment");
  try{
    const r = await assets.upload(f);
    obj.media = {type: t, url: r.url, id: r.id, name: f.name};
    obj.thumb = "";
    if(t === "image") obj.thumb = r.url;
    else if(t !== "audio"){
      const b = await makeThumb(f, t);
      if(b){ try{ const tr = await assets.upload(b); obj.thumb = tr.url; }catch(_){ /* keep the icon */ } }
    }
    after(); toast(obj.thumb ? "Uploaded with a cover image! Press Save to keep it." : "Uploaded! Press Save to keep it.");
  }catch(_){ toast("Upload failed. Try a smaller file or paste a link."); }
}

function toBlob(file, max, q){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image();
      im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement("canvas");
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, c.width, c.height);
        cx.drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", q); };
      im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

async function addGraphics(files){
  const assets = await claude.use("assets");
  if(!assets){ toast("Uploads aren't available for your account here"); return; }
  const imgs = files.filter(f => (f.type || "").startsWith("image/"));
  if(!imgs.length){ toast("Please choose image files (JPG, PNG, etc.)"); return; }
  const list = imgs.slice(0, Math.max(0, 60 - S.graphics.length));
  if(!list.length){ toast("The collage is full (60 images)"); return; }
  let n = 0; const fresh = [];
  for(const f of list){
    toast("Uploading " + (n + 1) + " of " + list.length + "…");
    try{ const b = await toBlob(f, 1800, .86); const r = await assets.upload(b); fresh.push({url: r.url, id: r.id, cap: ""}); n++; }
    catch(_){ /* skip this one */ }
  }
  S.graphics.unshift(...fresh); renderGraphics();
  toast(n ? n + (n > 1 ? " graphics added. " : " graphic added. ") + "Press Save to keep them." : "Upload failed. Try again.");
}

      body: JSON.stringify(Object.assign({access_key: W3F_KEY, subject: p.subject, from_name: n + " (portfolio)", name: n, email: e, replyto: e, message: m, botcheck: false}, EXTRA()))});
    const j = await res.json().catch(() => ({}));
    if(!res.ok || j.success === false) throw new Error(j.message || "failed");
    f.reset(); noteStatus("");
    $("#nfields").hidden = true; const ok = $("#sent"); ok.hidden = false; ok.focus();
  }catch(err){
    noteStatus("Sorry, the message couldn't be sent from here. Please use “Write it in Gmail instead”, or email " + S.email + ".", "err");
  }finally{
    clearTimeout(timer); delete f.dataset.busy; btn.removeAttribute("aria-busy"); btn.disabled = false;
  }
}
function noteParts(){
  const n = $("#nm").value.trim(), e = $("#ye").value.trim(), m = $("#ms").value.trim();
  const body = "Hi Joy,\n\n" + m + "\n\n" + (n ? "– " + n : "") + (e ? "\n" + e : "");
  return {n, e, m, body, subject: "Hello from your portfolio" + (n ? " – " + n : "")};
}
function gmailUrl(){
  const p = noteParts();
  return "https://mail.google.com/mail/?view=cm&fs=1&to=" + encodeURIComponent(S.email) + "&su=" + encodeURIComponent(p.subject) + "&body=" + encodeURIComponent(p.body);
}
function wireNote(){
  const g = $("#gsend");
  const upd = () => { g.href = gmailUrl(); };
  ["nm","ye","ms"].forEach(id => $("#" + id).addEventListener("input", upd));
  upd();
  g.addEventListener("click", e => {
    if(!$("#ms").value.trim()){ e.preventDefault(); toast("Write your message first"); $("#ms").focus(); return; }
    upd(); toast("Gmail is opening with your message ready. Press Send there!");
  });
  $("#note").addEventListener("submit", e => { e.preventDefault(); sendNote(); });
  $("#nagain").addEventListener("click", () => { $("#sent").hidden = true; $("#nfields").hidden = false; upd(); $("#nm").focus(); });
}

function renderConnect(){
  renderBook();
  const mb = $("#mailbox"), so = $("#socials");

      <div class="field"><label for="ph">Phone</label><input id="ph" data-p="phone" value="${esc(S.phone)}"></div>

    so.innerHTML = S.socials.map((s, i) => `<div class="erow"><input data-p="socials.${i}.label" value="${esc(s.label)}" aria-label="Label"><input data-p="socials.${i}.href" value="${esc(s.href)}" aria-label="Link, starting with https://"><button class="rm" type="button" data-rm="socials.${i}">remove</button></div>`).join("") + `<button class="btn sm" type="button" data-add="socials">${ic("plus")} Add a link</button>`;

  mb.innerHTML = line("mail","email") + line("phone","phone") + line("pin","address");
  $$("[data-cp]", mb).forEach(b => b.addEventListener("click", () => copy(S[b.dataset.cp], "Copied!")));

/* ---- saving the page into itself ---- */
const FALLBACK_RESET = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
function buildDoc(){
  const reset = (document.head.querySelector("style") || {}).textContent || FALLBACK_RESET;
  const json = JSON.stringify(S).replace(/</g, "\\u003c").split(String.fromCharCode(8232)).join("\\u2028").split(String.fromCharCode(8233)).join("\\u2029");
  const body = [
    "<title>HER Portfolio</title>",
    '<meta name="claude:viewport-fit-sides" content="cover">',
    $('link[rel="stylesheet"]').outerHTML,
    $("#page-css").outerHTML,
    $("#defs").outerHTML,
    $("#pdfjs").outerHTML,
    '<div id="app"></div>',
    $("#tpl").outerHTML,
    `<script type="application/json" id="state">${json}<\/script>`,
    $("#main-js").outerHTML
  ].join("\n");
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${reset}</style></head><body>${body}</body></html>`;
}
let saving = false;
async function save(){
  if(saving || !art) return; saving = true;
  const b = $("#esave"); if(b) b.textContent = "Saving…";
  try{ await art.publish(buildDoc()); toast("Saved!"); }
  catch(err){ saving = false; if(b) b.innerHTML = "Save"; toast(err && err.code === "conflict" ? "Someone saved first, so the page is reloading." : "Couldn't save. Please try again."); }
}

function showPencil(){
  const p = document.createElement("button"); p.className = "btn pencil"; p.type = "button"; p.id = "pencil";
  p.innerHTML = `${ic("pen")} Edit`; p.addEventListener("click", () => startEditing());
  document.body.appendChild(p);
}
function startEditing(){
  editing = true; document.body.classList.add("editing"); const p = $("#pencil"); if(p) p.remove();
  setEditable(); renderDyn();
  const bar = document.createElement("div"); bar.className = "ebar"; bar.id = "ebar";
  bar.innerHTML = `<span>Editing: tap any dashed text or photo</span><button class="btn sm" id="esave" type="button">Save</button><button class="btn sm alt" id="ediscard" type="button">Discard</button>`;
  document.body.appendChild(bar);
  $("#esave").addEventListener("click", save);
  $("#ediscard").addEventListener("click", () => { editing = false; document.body.classList.remove("editing"); S = JSON.parse(ORIGINAL); $("#ebar").remove(); closeModal(); mount(); showPencil(); toast("Changes discarded"); });
}
